name: Daily Video Generation

on:
  schedule:
    # 每天北京时间 9:00 (UTC 1:00)
    - cron: '0 1 * * *'
  workflow_dispatch:  # 允许手动触发

jobs:
  generate-videos:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # 2小时超时

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create config file
        run: |
          mkdir -p config
          cat > config/config.yaml << EOF
          llm:
            default_provider: "openai"
            anthropic_api_key: "${{ secrets.ANTHROPIC_API_KEY }}"
            openai_api_key: "${{ secrets.OPENAI_API_KEY }}"
            openai_base_url: "${{ secrets.OPENAI_BASE_URL }}"

          image:
            provider: "replicate"
            replicate_api_token: "${{ secrets.REPLICATE_API_TOKEN }}"
            model: "black-forest-labs/flux-1.1-pro"

          tts:
            provider: "openai"
            openai_api_key: "${{ secrets.OPENAI_API_KEY }}"
            openai_base_url: "${{ secrets.OPENAI_BASE_URL }}"

          working_dir: "./output"
          EOF

      - name: Run automation
        run: |
          python -m automation.main
        env:
          PYTHONUNBUFFERED: 1
          # LLM配置
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          # 图片生成
          IMAGE_GEN_API_KEY: ${{ secrets.IMAGE_GEN_API_KEY }}
          IMAGE_GEN_BASE_URL: ${{ secrets.IMAGE_GEN_BASE_URL }}
          IMAGE_GEN_MODEL: ${{ secrets.IMAGE_GEN_MODEL }}
          # 热点采集
          WEIBO_API_KEY: ${{ secrets.WEIBO_API_KEY }}
          WEIBO_COOKIE: ${{ secrets.WEIBO_COOKIE }}
          # 发布平台
          DOUYIN_CLIENT_KEY: ${{ secrets.DOUYIN_CLIENT_KEY }}
          DOUYIN_CLIENT_SECRET: ${{ secrets.DOUYIN_CLIENT_SECRET }}
          DOUYIN_ACCESS_TOKEN: ${{ secrets.DOUYIN_ACCESS_TOKEN }}
          KUAISHOU_APP_ID: ${{ secrets.KUAISHOU_APP_ID }}
          KUAISHOU_APP_SECRET: ${{ secrets.KUAISHOU_APP_SECRET }}
          WEIXIN_APP_ID: ${{ secrets.WEIXIN_APP_ID }}
          WEIXIN_APP_SECRET: ${{ secrets.WEIXIN_APP_SECRET }}
          # 其他配置
          WORKING_DIR: ${{ secrets.WORKING_DIR }}
          LOG_LEVEL: ${{ secrets.LOG_LEVEL }}
          MAX_WORKERS: ${{ secrets.MAX_WORKERS }}
          VIDEO_QUALITY: ${{ secrets.VIDEO_QUALITY }}
          VIDEO_FPS: ${{ secrets.VIDEO_FPS }}

      - name: Upload generated videos
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: generated-videos-${{ github.run_number }}
          path: |
            output/videos/*.mp4
            output/logs/*.log
          retention-days: 7

      - name: Send notification on failure
        if: failure()
        run: |
          echo "视频生成失败，请检查日志"
          # 这里可以添加通知逻辑（邮件/Webhook）

      - name: Clean up
        if: always()
        run: |
          rm -rf output/temp
          rm -rf output/images
